  --color-neutral-100:#f9f4ed;--color-neutral-200:#eee7db;--color-neutral-300:#dcd3c4;
  --color-neutral-400:#c0b6a5;--color-neutral-500:#a19786;--color-neutral-600:#82796a;
  --color-neutral-700:#645c50;--color-neutral-800:#474238;--color-neutral-900:#2e2b25;

  --color-accent-100:#fff2eb;--color-accent-200:#ffe1d0;--color-accent-300:#ffc6a5;
  --color-accent-400:#f6a06b;--color-accent-500:#d67f48;--color-accent-600:#b2622d;
  --color-accent-700:#8c491a;--color-accent-800:#643312;--color-accent-900:#402310;

  --color-accent-2-100:#f0fae1;--color-accent-2-200:#e1eecc;--color-accent-2-300:#ccdbb2;
  --color-accent-2-400:#aebf92;--color-accent-2-500:#8fa073;--color-accent-2-600:#728157;
  --color-accent-2-700:#56633f;--color-accent-2-800:#3d472b;--color-accent-2-900:#272e1b;

  --sea-100:#e2edf1;--sea-200:#c3dbe4;--sea-300:#9cc3d2;--sea-500:#4f8ba4;
  --sea-600:#3a7189;--sea-700:#2b5769;--sea-800:#1d3c49;

  /* aardebruin, voor Bezoeken (kleur van het vulkaansteen van de kathedraal) */
  --cocoa-100:#f3ece0;--cocoa-200:#e4d5c0;--cocoa-300:#cbb597;--cocoa-400:#ad9370;
  --cocoa-500:#8e7454;--cocoa-600:#725b40;--cocoa-700:#57442e;--cocoa-800:#3c2f1f;

  /* oker, voor Horeca: saffraan, mojo, citroen */
  --ochre-100:#fbf2dc;--ochre-200:#f2e0b0;--ochre-300:#e4c87f;--ochre-400:#cfab4e;
  --ochre-500:#b08c2e;--ochre-600:#8e6f22;--ochre-700:#6e551a;--ochre-800:#4d3b12;

  /* stoffig roze, uit het avondlicht op de witte huizen bij Dorpjes */
  --rose-100:#f8ece8;--rose-200:#ecd6cf;--rose-300:#dbb8ae;--rose-400:#c2988d;
  --rose-500:#a87b70;--rose-600:#8b6157;--rose-700:#6d4a42;--rose-800:#4e332d;

  --font-heading:"Caprasimo",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,sans-serif;

  --radius-md:16px;
  --shadow-sm:0 1px 2px color-mix(in srgb,#2e2b25 14%,transparent);
  --shadow-md:0 3px 10px color-mix(in srgb,#2e2b25 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2e2b25 22%,transparent);

  /* hero + de organische vorm eronder */
  --hero-h:352px;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);font-size:15px;line-height:1.55;
  color:var(--color-text);background:var(--color-bg);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--font-heading);font-weight:400;line-height:1.12;
  letter-spacing:-.015em;margin:0}
a{color:var(--color-accent-700)}
button{font-family:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
*::-webkit-scrollbar{display:none}
.scroll-x{-ms-overflow-style:none;scrollbar-width:none;overflow-x:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;text-decoration:none;font-family:var(--font-heading);font-weight:400;
  font-size:14px;line-height:1.2;color:var(--color-text);background:transparent;
  border:1px solid transparent;padding:8.8px 15.8px;border-radius:var(--radius-md)}
.btn-primary{background:var(--color-accent);color:var(--color-bg)}
.btn-primary:hover{background:var(--color-accent-600)}
.btn-primary:active{background:var(--color-accent-700)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-ghost{color:var(--color-accent);padding-inline:4.4px}
.btn-ghost:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent)}
.btn-block{width:100%}
.btn-danger{background:#8c3a1a;color:var(--color-bg)}
.btn-danger:hover{background:#742f14}

.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;
  color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);
  border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.input:hover{border-color:color-mix(in srgb,var(--color-text) 45%,transparent)}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0}

.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;
  padding:3px 10px;border-radius:12px}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent)}

/* ── shell ───────────────────────────────────────────────────────────── */
.app{min-height:100dvh;display:flex;justify-content:center;
  background:var(--c-wash);transition:background 1050ms ease}
.frame{width:100%;max-width:460px;position:relative;display:flex;
  flex-direction:column;min-height:100dvh;overflow:hidden}

/* geen tweede rand meer: de kleur komt als een diffuse gloed onder de foto
   vandaan, zonder eigen contour. Eén scherpe vorm, één zachte. */
.glow{position:absolute;top:calc(var(--hero-h) - 200px);left:-48%;right:-48%;height:560px;
  background:radial-gradient(64% 80% at 62% 0%,
    var(--c-glow) 0%,
    color-mix(in srgb,var(--c-glow) 58%,var(--c-soft)) 26%,
    color-mix(in srgb,var(--c-soft) 86%,transparent) 50%,
    color-mix(in srgb,var(--c-soft) 38%,transparent) 70%,
    transparent 88%);
  pointer-events:none;z-index:0;transition:background 1050ms ease}

/* ── hero: loopt door tot de bovenkant van het scherm ────────────────── */
/* Safari knipt een geanimeerd kind soms pas na de animatie bij, waardoor de
   foto heel even vierkant is. Daarom krijgt elk kind dezelfde ronding mee en
   dwingt het masker de browser om meteen goed te knippen. */
/* De ronding wordt op drie manieren afgedwongen, omdat Safari een foto die
   nog aan het decoderen is soms even buiten de afgeronde rand tekent:
   overflow, clip-path (die knipt ook losse compositielagen) en dezelfde
   ronding op de foto zelf. De animatie gebruikt bewust geen transform,
   want juist dat gaf de foto een eigen laag die te laat werd bijgeknipt. */
.hero{position:relative;z-index:1;margin:0 -12%;height:var(--hero-h);
  border-radius:0 0 58% 42%/0 0 32% 24%;overflow:hidden;
  -webkit-clip-path:inset(0 round 0 0 58% 42% / 0 0 32% 24%);
  clip-path:inset(0 round 0 0 58% 42% / 0 0 32% 24%);
  background:var(--c-soft);transition:background 1050ms ease}
.hero > *{border-radius:inherit}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  border-radius:0 0 58% 42%/0 0 32% 24%;
  filter:saturate(.78) contrast(.92) brightness(1.05);opacity:.96}
.frame.enter .hero-img{animation:heroIn 840ms ease both}
/* lichte waas: de foto lost onderaan op in het papier.
   --haze zet er per categorie nog een vlakke sluier overheen. */
.hero-haze{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(0deg,
      color-mix(in srgb,var(--color-bg) var(--haze,0%),transparent) 0%,
      color-mix(in srgb,var(--color-bg) var(--haze,0%),transparent) 100%),
    linear-gradient(180deg,
    color-mix(in srgb,var(--color-bg) 12%,transparent) 0%,
    color-mix(in srgb,var(--color-bg) 3%,transparent) 34%,
    color-mix(in srgb,var(--color-bg) 20%,transparent) 76%,
    color-mix(in srgb,var(--color-bg) 46%,transparent) 100%)}
/* de categoriekleur kleurt zachtjes mee */
.hero-tint{position:absolute;inset:0;pointer-events:none;background:var(--c-mid);
  opacity:.08;mix-blend-mode:soft-light;transition:background 1050ms ease}
/* donkere sluier bovenaan, puur zodat de titel leesbaar blijft */
.hero-scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(24,22,20,.62) 0%,rgba(24,22,20,.38) 20%,
    rgba(24,22,20,.14) 38%,transparent 56%)}
/* geen foto: donkere kop zodat de titel leesbaar blijft, daarna de eigen kleur */
.hero-empty{position:absolute;inset:0;display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:54px;font-size:12.5px;letter-spacing:.06em;
  text-transform:uppercase;color:color-mix(in srgb,var(--c-deep) 55%,transparent);
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--c-deep) 72%,var(--c-soft)) 0%,
    color-mix(in srgb,var(--c-deep) 22%,var(--c-soft)) 30%,
    var(--c-soft) 58%,
    color-mix(in srgb,var(--c-mid) 20%,var(--color-bg)) 100%)}

.top{position:absolute;top:0;left:0;right:0;z-index:3;padding:0 22px;text-align:center;
  padding-top:max(44px,calc(env(safe-area-inset-top) + 26px));pointer-events:none}
.top h1{font-size:34px;margin:0;color:var(--color-bg);
  text-shadow:0 1px 12px rgba(24,22,20,.34)}
.top .sub{font-size:13.5px;line-height:1.3;margin-top:1px;
  color:color-mix(in srgb,var(--color-bg) 88%,transparent);
  text-shadow:0 1px 10px rgba(24,22,20,.38)}

/* ── categorieën ─────────────────────────────────────────────────────── */
/* overflow-x knipt ook verticaal af, dus de schaduw heeft ruimte nodig
   binnen de container. De marge compenseert de extra padding. */
/* vijf categorieën passen precies; komen er meer bij, dan schuift de rij weer */
/* De categorieën verdelen de breedte gelijk over de rij, zonder schuiven. */
.cats{position:relative;z-index:3;display:flex;gap:8px;padding:14px 20px 22px;
  margin-top:-44px}
.chip{cursor:pointer;flex:1 1 0;min-width:0;white-space:nowrap;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 8px;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--font-heading);font-size:clamp(12px,3.2vw,14px);line-height:1;
  box-shadow:var(--shadow-md);
  transition:background 300ms ease,transform 300ms ease,box-shadow 300ms ease}
/* in het formulier mogen ze hun eigen breedte houden */
.dialog .chip{flex:none;padding:9px 14px}
.chip-on{transform:scale(1.05)}
.chip-on{border:1px solid transparent;background:var(--c-mid);color:var(--color-bg)}
.chip-off{background:var(--color-bg);color:var(--cocoa-700);
  border:1px solid var(--color-neutral-300)}
.chip-off:hover{background:var(--color-neutral-100)}
/* in het formulier liggen de chips op een egale ondergrond, geen schaduw nodig */
.dialog .chip{box-shadow:none}
.dialog .scroll-x .chip{font-size:13px}

/* ── lijst ───────────────────────────────────────────────────────────── */
.list{position:relative;z-index:2;flex:1;padding:4px 22px 120px;display:flex;
  flex-direction:column}
.item{padding:15px 2px;display:flex;gap:10px;align-items:flex-start;
  border-bottom:1px solid color-mix(in srgb,var(--color-text) 11%,transparent);
  }
.frame.enter .item{animation:rowIn 600ms ease both;
  animation-delay:calc(var(--i,0) * 76ms)}
.item.flash{animation:flash 620ms ease}
.item:last-child{border-bottom:0}
.item-body{flex:1;cursor:pointer;min-width:0}
.item-body h3{font-size:17.5px;margin:0 0 3px;text-wrap:pretty;color:var(--cocoa-700)}
.item-meta{font-size:12.5px;line-height:1.45;color:rgba(32,30,29,.58)}
.item-tags{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
/* volgorde aanpassen: twee smalle chevrons, rustig aanwezig */
.ord{flex:none;display:flex;flex-direction:column;gap:1px;margin:-2px -4px 0 0}
.ord-btn{width:30px;height:24px;border:0;background:none;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;border-radius:9px;
  color:color-mix(in srgb,var(--color-text) 34%,transparent);
  transition:color 200ms ease,background 200ms ease,opacity 200ms ease}
.ord-btn svg{width:15px;height:15px;stroke-width:2.4}
.ord-btn:hover{color:var(--c-deep);background:color-mix(in srgb,var(--color-text) 6%,transparent)}
.ord-btn:disabled{opacity:.18;cursor:default;background:none;
  color:color-mix(in srgb,var(--color-text) 34%,transparent)}
.empty{padding:30px 4px;font-size:14px;color:rgba(32,30,29,.5)}

.dock{position:sticky;bottom:0;z-index:4;padding:14px 22px 22px;
  padding-bottom:max(22px,calc(env(safe-area-inset-bottom) + 14px));
  background:linear-gradient(to top,var(--c-wash) 55%,transparent);
  transition:background 1050ms ease;display:flex;justify-content:center;gap:10px}
/* korte melding onderin bij verbinden of wegvallen van de synchronisatie */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);
  transform:translateX(-50%);z-index:30;padding:9px 16px;border-radius:999px;
  background:color-mix(in srgb,var(--color-text) 88%,transparent);color:var(--color-bg);
  font-size:12.5px;white-space:nowrap;box-shadow:var(--shadow-lg);
  animation:toastIn 240ms ease both;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}
  to{opacity:1;transform:translate(-50%,0)}}
/* De hoofdknop hoort bij de categorietegels: dezelfde pilvorm, dezelfde
   lettergrootte en schaduw, en dezelfde kleur als de actieve categorie. */
/* Even hoog als de categorietegels: dezelfde padding, rand en regelhoogte,
   alleen wat ruimer opzij zodat de knop niet als vijfde tegel leest. */
.dock .btn{flex:none;height:auto;padding:10px 26px;white-space:nowrap}
.btn-chip{border-radius:999px;border:1px solid transparent;
  background:var(--c-mid);color:var(--color-bg);box-shadow:var(--shadow-md);
  font-family:var(--font-heading);font-size:clamp(12px,3.2vw,14px);line-height:1;
  transition:background 1050ms ease,box-shadow 300ms ease,transform 300ms ease}
.btn-chip:hover{background:color-mix(in srgb,var(--c-deep) 32%,var(--c-mid));
  box-shadow:var(--shadow-lg)}
.btn-chip:active{background:var(--c-deep);transform:scale(.985)}

/* ── overlays ────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(32,30,29,.42);display:flex;
  justify-content:center;z-index:20;animation:fade 180ms ease}
.scrim-bottom{align-items:flex-end}
.scrim-center{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{opacity:0}to{opacity:.96}}
@keyframes flash{0%{background:color-mix(in srgb,var(--c-soft) 85%,transparent)}
  100%{background:transparent}}
.sheet{width:100%;max-width:460px;background:var(--color-surface);
  border-radius:34px 34px 0 0;padding:26px 24px 28px;
  padding-bottom:max(28px,calc(env(safe-area-inset-bottom) + 18px));
  max-height:86dvh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:rise 220ms ease}
.sheet h2{font-size:26px;margin:8px 0 8px;text-wrap:pretty;color:var(--cocoa-700)}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-title{flex:1;min-width:0}
.sheet-title h2{margin:0 0 6px}
.sheet-tools{display:flex;gap:8px;flex:none;padding-top:5px}
.tool{width:38px;height:38px;border-radius:999px;border:1px solid var(--color-divider);
  background:transparent;color:var(--color-text);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.tool:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.tool svg{width:17px;height:17px}
/* verwijderen is de enige onomkeerbare actie, dus in een eigen kleur */
.btn-del{color:#8c3a1a}
.btn-del:hover{background:color-mix(in srgb,#8c3a1a 10%,transparent)}
.prose{font-size:15px;line-height:1.65;text-wrap:pretty}
.blocklabel{font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(32,30,29,.45);margin:20px 0 6px}
.links{display:flex;flex-direction:column;gap:8px;margin:22px 0 4px}
.linkrow{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:18px;
  background:var(--color-bg);color:var(--color-text);text-decoration:none;font-size:14.5px;
  border:1px solid var(--color-divider)}
.linkrow:hover{background:var(--color-neutral-100)}
.linkrow svg{width:18px;height:18px;flex:none;color:var(--c-deep)}
.linkrow .lr-label{flex:1;min-width:0}
.linkrow .lr-sub{font-size:12.5px;color:rgba(32,30,29,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--c-deep)}
.rule{height:1px;background:var(--color-neutral-200);margin:18px 0}
.dialog{width:100%;max-width:420px;background:var(--color-surface);border-radius:32px;
  padding:24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:14px;
  max-height:88dvh;overflow-y:auto}
.dialog h2{font-size:22px;margin:0}
.dialog .hint{font-size:13.5px;line-height:1.55;color:rgba(32,30,29,.6)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;
  color:rgba(32,30,29,.6)}
textarea.input{border-radius:20px;min-height:76px;padding:12px 14px;
  font-family:var(--font-body);resize:vertical}
.row{display:flex;gap:10px;margin-top:4px}
.row .btn{flex:1;height:46px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

<div class="app" id="app"></div>

const KEY = 'gc-arguineguin-v1';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const emptyForm = () => ({id:null, cat:'actief', title:'', desc:'', note:'', url:'', place:''});

let st = {cat:'actief', extra:[], cats:[], edits:{}, removed:{}, order:{},
          open:null, adding:false, confirmDel:null, flash:null, toast:null,
          f:emptyForm()};

try{
  const s = JSON.parse(localStorage.getItem(KEY) || '{}');
  if(s.extra) st.extra = s.extra;
  if(s.cats) st.cats = s.cats;
  if(s.edits) st.edits = s.edits;
  if(s.removed) st.removed = s.removed;
  if(s.order) st.order = s.order;


  /* Oud model (meta/drive/tag, sleutel 'categorie|titel') omzetten naar het
     nieuwe model met een vast id per idee. */
  st.extra = st.extra.map((i, n) => {
    if(i.id && i.desc !== undefined) return i;
    const bits = [i.meta, i.drive].filter(x => x && x !== 'nog invullen' && x !== 'Eigen idee');
    return {id: i.id || ('eigen-oud-' + n), cat:i.cat, title:i.title,
            desc: bits.join(' · '), note: i.note || '', url:'', place:''};
  });
}catch(e){}

      {extra:st.extra, cats:st.cats,
       edits:st.edits, removed:st.removed, order:st.order}));
    if(!applyingRemote && onLocalChange) onLocalChange();
    return true;
  }catch(e){
    alert('De opslag op dit toestel zit vol. Verwijder een eigen foto en probeer opnieuw.');
    return false;
  }
}

function set(patch){ Object.assign(st, patch); render(); }

const order = () => ORDER.concat(st.cats.map(c => c.id));
function theme(id){
  if(THEMES[id]) return THEMES[id];
  const c = st.cats.find(x => x.id === id);
  if(!c) return THEMES.actief;
  const p = PALETTES[c.p % PALETTES.length];
  return Object.assign({label:c.label}, p);
}
/* Hiken heet nu Actief; Bezoeken en Dorpjes zijn samengevoegd tot To-do.
   Deze omzetting draait op wat lokaal staat en op wat van de server komt. */
const CAT_ALIAS = {hiken:'actief', bezoeken:'todo', dorpjes:'todo'};
const fixCat = c => CAT_ALIAS[c] || c;

function normaliseCats(){
  const before = JSON.stringify([st.extra, st.edits, st.order, st.cat]);
  st.extra = st.extra.map(i =>
    CAT_ALIAS[i.cat] ? Object.assign({}, i, {cat:fixCat(i.cat)}) : i);
  Object.keys(st.edits).forEach(k => {
    const e = st.edits[k];
    if(e && CAT_ALIAS[e.cat]) e.cat = fixCat(e.cat);
  });
  Object.keys(CAT_ALIAS).forEach(oldCat => {
    const list = st.order[oldCat];
    if(!list) return;
    const target = fixCat(oldCat);
    const cur = st.order[target] || [];
    st.order[target] = cur.concat(list.filter(id => cur.indexOf(id) === -1));
    delete st.order[oldCat];
  });
  if(CAT_ALIAS[st.cat]) st.cat = fixCat(st.cat);
  return before !== JSON.stringify([st.extra, st.edits, st.order, st.cat]);
}

const isSeed = id => SEED.some(x => x.id === id);
/* De standaardideeën staan vast in het bestand. Bewerkingen en verwijderingen
   bewaren we los, zodat een nieuwe versie van de app ze niet overschrijft. */
const all = () => SEED
  .filter(i => !st.removed[i.id])
  .map(i => st.edits[i.id] ? Object.assign({}, i, st.edits[i.id]) : i)
  .concat(st.extra);
const byId = id => all().find(i => i.id === id);

/* De volgorde per categorie is een lijstje met ids. Wat er niet in staat
   (bijvoorbeeld een nieuw idee) sluit gewoon achteraan aan. */
function ordered(cat){
  const ord = st.order[cat] || [];
  return all().filter(i => i.cat === cat).sort((a, b) => {
    const ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
    if(ia === -1 && ib === -1) return 0;
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
}

function move(id, dir){
  const list = ordered(st.cat);
  const i = list.findIndex(x => x.id === id), j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  st.order[st.cat] = list.map(x => x.id);
  persist();
  set({flash:id});
  setTimeout(() => { if(st.flash === id) set({flash:null}); }, 640);
}

function saveIdea(f){
  const fields = {cat:f.cat, title:f.title, desc:f.desc, note:f.note, url:f.url, place:f.place};
  if(f.id && isSeed(f.id)){
    st.edits[f.id] = fields;
  }else if(f.id){
    st.extra = st.extra.map(i => i.id === f.id ? Object.assign({}, i, fields) : i);
  }else{
    f.id = 'eigen-' + Date.now().toString(36);
    st.extra = st.extra.concat([Object.assign({id:f.id}, fields)]);
  }
  persist();
  return f.id;
}

function removeIdea(id){
  if(isSeed(id)) st.removed[id] = true;
  else st.extra = st.extra.filter(i => i.id !== id);
  persist();
}

/* Een adres of plaatsnaam wordt een zoekopdracht in Google Maps. Plak je een
   kant-en-klare Maps-link, dan gebruiken we die ongewijzigd. */
function mapsUrl(it){
  const q = (it.place || '').trim();
  if(!q) return '';
  if(/^https?:\/\//i.test(q)) return q;
  const full = /canaria/i.test(q) ? q : q + ', Gran Canaria';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(full);
}
function webUrl(it){
  const u = (it.url || '').trim();
  if(!u) return '';
  return /^https?:\/\//i.test(u) ? u : 'https://' + u;
}
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return ''; } };

let enteredCat = null;

function render(){
  const t = theme(st.cat);
  /* Alleen bij een echte categoriewissel de foto en de rijen laten invliegen,
     niet elke keer dat een venster open- of dichtgaat. */
  const enter = enteredCat !== st.cat;
  enteredCat = st.cat;
  const photo = PHOTOS[st.cat];

  const chips = order().map(id =>
    `<button class="chip ${id === st.cat ? 'chip-on' : 'chip-off'}" data-pick="${esc(id)}">${esc(theme(id).label)}</button>`
  ).join('');

  const items = ordered(st.cat);
  const rows = items.map((it, i) =>
    `<div class="item${st.flash === it.id ? ' flash' : ''}" style="--i:${Math.min(i, 9)}">
      <div class="item-body" data-open="${esc(it.id)}">
        <h3>${esc(it.title)}</h3>
        ${it.desc ? `<div class="item-meta">${esc(it.desc)}</div>` : ''}
      </div>
      <div class="ord">
        <button class="ord-btn" data-up="${esc(it.id)}" aria-label="Hoger in de lijst"
          ${i === 0 ? 'disabled' : ''}>${ICON_UP}</button>
        <button class="ord-btn" data-down="${esc(it.id)}" aria-label="Lager in de lijst"
          ${i === items.length - 1 ? 'disabled' : ''}>${ICON_DOWN}</button>
      </div>
    </div>`
  ).join('');

  const found = byId(st.open);

  document.getElementById('app').innerHTML = `
  <div class="frame${enter ? ' enter' : ''}" style="--c-soft:${t.soft};--c-mid:${t.mid};--c-deep:${t.deep};--c-glow:${t.glow || t.soft};--c-wash:${t.wash};--haze:${t.haze || '0%'}">
    <div class="glow"></div>

    <div class="hero">
      ${photo
        ? `<img class="hero-img" src="${photo}" alt="">
           <div class="hero-haze"></div>
           <div class="hero-tint"></div>
           <div class="hero-scrim"></div>`
        : `<div class="hero-empty">Foto van ${esc(t.label.toLowerCase())}</div>`}
    </div>

    <div class="top">
      <h1>Gran Canaria</h1>
      <div class="sub">Arguineguín</div>
    </div>
    <div class="cats scroll-x">${chips}</div>

    <div class="list">
      ${rows || '<div class="empty">Nog niets hier. Voeg een idee toe.</div>'}
    </div>

    <div class="dock">
      <button class="btn btn-chip" data-add>Idee toevoegen</button>
    </div>

    ${found ? detailSheet(found) : ''}
    ${st.toast ? `<div class="toast">${esc(st.toast)}</div>` : ''}
    ${st.confirmDel ? confirmDialog() : ''}
    ${st.adding ? ideaDialog() : ''}
  </div>`;

  wire();
}

function detailSheet(it){
  const web = webUrl(it), maps = mapsUrl(it), host = hostOf(web);
  return `<div class="scrim scrim-bottom" data-close>
    <div class="sheet" data-stop>
      <div class="sheet-head">
        <div class="sheet-title">
          <h2>${esc(it.title)}</h2>
          <div class="eyebrow">${esc(theme(it.cat).label)}</div>
        </div>
        <div class="sheet-tools">
          <button class="tool" data-edit="${esc(it.id)}"
            aria-label="Bewerken" title="Bewerken">${ICON_EDIT}</button>
          <button class="tool" data-close
            aria-label="Sluiten" title="Sluiten">${ICON_CLOSE}</button>
        </div>
      </div>

      <div class="rule"></div>

      ${it.desc ? `<div class="prose">${esc(it.desc)}</div>` : ''}
      ${it.note ? `<div class="blocklabel">Opmerkingen</div>
                   <div class="prose">${esc(it.note)}</div>` : ''}
      ${!it.desc && !it.note ? `<div class="prose" style="color:rgba(32,30,29,.5)">Nog niets ingevuld.</div>` : ''}

      ${(web || maps) ? `<div class="links">
        ${web ? `<a class="linkrow" href="${esc(web)}" target="_blank" rel="noopener">
            ${ICON_GLOBE}<span class="lr-label">Website</span>
            ${host ? `<span class="lr-sub">${esc(host)}</span>` : ''}${ICON_CHEV}</a>` : ''}
        ${maps ? `<a class="linkrow" href="${esc(maps)}" target="_blank" rel="noopener">
            ${ICON_PIN}<span class="lr-label">Open in Google Maps</span>${ICON_CHEV}</a>` : ''}
      </div>` : ''}

      <button class="btn btn-ghost btn-block btn-del" style="margin-top:18px;height:44px"
        data-del="${esc(it.id)}">Verwijderen</button>
    </div>
  </div>`;
}

function confirmDialog(){
  const it = byId(st.confirmDel);
  return `<div class="scrim scrim-center" data-closedel>
    <div class="dialog" data-stop>
      <h2>Verwijderen?</h2>
      <div class="hint">${esc(it ? it.title : 'Dit idee')} wordt uit de lijst gehaald.
        Dit kun je niet ongedaan maken.</div>
      <div class="row">
        <button class="btn btn-ghost" data-closedel>Annuleer</button>
        <button class="btn btn-danger" data-confirmdel>Verwijderen</button>
      </div>
    </div>
  </div>`;
}

function ideaDialog(){
  const f = st.f;
  const chips = order().map(id =>
    `<button class="chip ${id === f.cat ? 'chip-on' : 'chip-off'}" data-fpick="${esc(id)}">${esc(theme(id).label)}</button>`
  ).join('');
  return `<div class="scrim scrim-center" data-closeadd>
    <div class="dialog" data-stop>
      <h2>${f.id ? 'Idee bewerken' : 'Nieuw idee'}</h2>
      <div class="scroll-x" style="display:flex;gap:7px">${chips}</div>
      <label class="field">Titel
        <input class="input" id="fTitle" value="${esc(f.title)}" placeholder="Waar of wat?"></label>
      <label class="field">Omschrijving
        <textarea class="input" id="fDesc" placeholder="Wat is het, hoe lang duurt het, wat kost het?">${esc(f.desc)}</textarea></label>
      <label class="field">Opmerkingen
        <textarea class="input" id="fNote" placeholder="Wat wil je onthouden?">${esc(f.note)}</textarea></label>
      <label class="field">Website
        <input class="input" id="fUrl" type="url" inputmode="url" autocapitalize="off"
          value="${esc(f.url)}" placeholder="bijv. laspalmas.com"></label>
      <label class="field">Locatie voor Google Maps
        <input class="input" id="fPlace" value="${esc(f.place)}"
          placeholder="Plaatsnaam, adres of een Maps-link"></label>
      <div class="row">
        <button class="btn btn-ghost" data-closeadd>Annuleer</button>
        <button class="btn btn-primary" data-submit>${f.id ? 'Opslaan' : 'Toevoegen'}</button>
      </div>
    </div>
  </div>`;
}

function readForm(){
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  if(st.adding) Object.assign(st.f, {title:g('fTitle'), desc:g('fDesc'),
    note:g('fNote'), url:g('fUrl'), place:g('fPlace')});
}

function wire(){
  const app = document.getElementById('app');
  const on = (sel, fn) => app.querySelectorAll(sel).forEach(el =>
    el.addEventListener('click', e => { e.stopPropagation(); fn(el, e); }));

  on('[data-pick]', el => set({cat:el.dataset.pick}));
  on('[data-fpick]', el => { readForm(); st.f.cat = el.dataset.fpick; render(); });
  on('[data-open]', el => set({open:el.dataset.open}));
  on('[data-up]', el => move(el.dataset.up, -1));
  on('[data-down]', el => move(el.dataset.down, 1));
  on('[data-close]', () => set({open:null}));
  on('[data-add]', () => {
    st.f = emptyForm(); st.f.cat = st.cat;
    set({adding:true});
  });
  on('[data-closeadd]', () => set({adding:false}));
  on('[data-edit]', el => {
    const it = byId(el.dataset.edit);
    if(!it) return;
    st.f = {id:it.id, cat:it.cat, title:it.title || '', desc:it.desc || '',
            note:it.note || '', url:it.url || '', place:it.place || ''};
    set({adding:true, open:null});
  });
  on('[data-del]', el => set({confirmDel:el.dataset.del}));
  on('[data-closedel]', () => set({confirmDel:null}));
  on('[data-confirmdel]', () => {
    removeIdea(st.confirmDel);
    set({confirmDel:null, open:null});
  });
  on('[data-stop]', () => {});

  /* In een ingesloten voorbeeldvenster wordt een nieuw tabblad soms geblokkeerd.
     Lukt het openen niet, dan navigeren we gewoon in het huidige venster. */
  app.querySelectorAll('a.linkrow').forEach(a => {
    a.addEventListener('click', e => {
      e.stopPropagation();
      const href = a.getAttribute('href');
      if(!href) return;
      let win = null;
      try{ win = window.open(href, '_blank', 'noopener'); }catch(err){}
      if(!win){ e.preventDefault(); try{ window.top.location.href = href; }
                catch(err){ window.location.href = href; } }
    });
  });

  on('[data-submit]', () => {
    readForm();
    const f = st.f;
    f.title = f.title.trim();
    if(!f.title) return;
    ['desc','note','url','place'].forEach(k => { f[k] = (f[k] || '').trim(); });
    const id = saveIdea(f);
    set({adding:false, cat:f.cat, open:id});
  });

}

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(st.confirmDel) set({confirmDel:null});
  else if(st.adding) set({adding:false});
  else if(st.open) set({open:null});
});

if(normaliseCats()) persist();
render();

/* De foto's eenmalig laten inlezen en decoderen. Daarna verschijnt een
   andere categorie meteen, zonder dat de browser nog werk hoeft te doen. */
Object.keys(PHOTOS).forEach(k => {
  const img = new Image();
  img.src = PHOTOS[k];
  if(img.decode) img.decode().catch(() => {});
});

/* ── Koppelstuk voor de synchronisatie ──────────────────────────────────
   De module onderaan de pagina praat hiermee. Werkt die niet (geen internet,
   Firebase onbereikbaar), dan draait de app gewoon door op dit toestel. */
const toArray = v => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

window.App = {
  keys: SYNC_KEYS,

  snapshot(){
    const o = {};
    SYNC_KEYS.forEach(k => { o[k] = st[k]; });
    return o;
  },

  /* first = de allereerste keer dat we gegevens van de server zien. Dan voegen
     we eigen ideeën samen in plaats van ze te overschrijven, zodat er niets
     verloren gaat als twee toestellen los van elkaar dingen hadden staan. */
  applyRemote(data, first){
    applyingRemote = true;
    let changed = false;

    SYNC_KEYS.forEach(k => {
      const raw = data ? data[k] : undefined;
      if(raw === undefined || raw === null) return;
      let next = (k === 'extra') ? toArray(raw) : raw;

      if(first && k === 'extra'){
        const ids = next.map(i => i.id);
        next = next.concat(st.extra.filter(i => ids.indexOf(i.id) === -1));
      }
      if(first && k !== 'extra' && typeof next === 'object'){
        next = Object.assign({}, st[k], next);
      }
      if(!same(next, st[k])){ st[k] = next; changed = true; }
    });

    if(changed){ normaliseCats(); persist(); }
    applyingRemote = false;
    /* Niet opnieuw tekenen terwijl iemand in een formulier staat te typen. */
    if(changed && !st.adding) render();
    return changed;
  },

  onChange(fn){ onLocalChange = fn; },

  toast(text){
    st.toast = text;
    render();
    clearTimeout(window.App._t);
    window.App._t = setTimeout(() => { st.toast = null; render(); }, 2600);
  }
};

/* Service worker: laat de app werken zonder internet.
   Werkt alleen via https (dus op GitHub Pages), niet bij een lokaal bestand. */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

<!-- ── Synchronisatie via Firebase ─────────────────────────────────────────
     De sleutel hieronder is geen wachtwoord; Firebase-sleutels horen openbaar
     in de code te staan. De beveiliging zit in de regels van de database:
     alleen aangemelde bezoekers mogen bij het mapje 'trip'. -->
<script type="module">
const CONFIG = {
  apiKey: "AIzaSyBT5hk9P2KmwKoaqajdchfKcqC5GhIvRwM",
  authDomain: "grancanaria-fe1ae.firebaseapp.com",
  databaseURL: "https://grancanaria-fe1ae-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "grancanaria-fe1ae",
  storageBucket: "grancanaria-fe1ae.firebasestorage.app",
  messagingSenderId: "693533223437",
  appId: "1:693533223437:web:677d2ff78a63d954e14344"
};
const NODE = 'trip';
const CDN  = 'https://www.gstatic.com/firebasejs/12.18.0/';

(async () => {
  if(!window.App) return;
  let A, U, D;
  try{
    [A, U, D] = await Promise.all([
      import(CDN + 'firebase-app.js'),
      import(CDN + 'firebase-auth.js'),
      import(CDN + 'firebase-database.js')
    ]);
  }catch(e){
    console.warn('Firebase niet geladen, de app werkt lokaal door.', e);
    return;
  }

  let db, root;
  try{
    const app = A.initializeApp(CONFIG);
    db   = D.getDatabase(app);
    root = D.ref(db, NODE);
    await U.signInAnonymously(U.getAuth(app));
  }catch(e){
    console.warn('Aanmelden bij Firebase mislukt.', e);
    window.App.toast('Synchroniseren lukt niet, alles blijft lokaal bewaard');
    return;
  }

  let first = true, ready = false, writing = false;

  D.onValue(root, snap => {
    const val = snap.val();
    if(first && (val === null || val === undefined)){
      /* Server is nog leeg: dit toestel zet de eerste gegevens klaar. */
      first = false; ready = true;
      push();
      window.App.toast('Gesynchroniseerd');
      return;
    }
    window.App.applyRemote(val || {}, first);
    if(first){ first = false; ready = true; window.App.toast('Gesynchroniseerd'); }
  }, err => {
    console.warn('Lezen uit Firebase mislukt.', err);
    window.App.toast('Synchroniseren lukt niet, alles blijft lokaal bewaard');
  });

  /* Per onderdeel wegschrijven in plaats van alles in één klap. Bewerken twee
     mensen tegelijk iets anders, dan overschrijven ze elkaar niet. */
  function push(){
    if(!ready || writing) return;
    writing = true;
    const data = window.App.snapshot();
    Promise.all(window.App.keys.map(k =>
      D.set(D.ref(db, NODE + '/' + k), data[k] === undefined ? null : data[k])
    )).catch(e => console.warn('Opslaan in Firebase mislukt.', e))
      .finally(() => { writing = false; });
  }

  window.App.onChange(push);

  /* Melding als de verbinding wegvalt of terugkomt. */
  let seen = false;
  D.onValue(D.ref(db, '.info/connected'), s => {
    const on = s.val() === true;
    if(seen) window.App.toast(on ? 'Weer verbonden' : 'Offline, wijzigingen worden bewaard');
    if(on) seen = true;
  });
})();
</script>
